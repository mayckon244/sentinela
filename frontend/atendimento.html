<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MedFlow | Atendimento</title>

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;

      --background: #f1f5f9;
      --white: #ffffff;

      --text: #172033;
      --muted: #64748b;

      --border: #e2e8f0;

      --success: #15803d;
      --success-bg: #f0fdf4;

      --error: #dc2626;
      --error-bg: #fef2f2;
    }


    /* =========================================
       BODY
    ========================================= */

    body {
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 10%,
          #dbeafe 0,
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 90%,
          #e0e7ff 0,
          transparent 30%
        ),
        var(--background);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 15px;
    }


    /* =========================================
       CONTAINER
    ========================================= */

    .container {
      width: 100%;
      max-width: 520px;
    }


    /* =========================================
       CARD
    ========================================= */

    .card {
      background: var(--white);

      border-radius: 24px;

      padding: 40px;

      border: 1px solid rgba(226, 232, 240, .8);

      box-shadow:
        0 25px 60px rgba(15, 23, 42, .10),
        0 5px 15px rgba(15, 23, 42, .04);

      animation: aparecer .5s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================================
       LOGO
    ========================================= */

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;

      margin-bottom: 35px;
    }

    .logo {
      width: 52px;
      height: 52px;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #3b82f6
        );

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 10px 25px rgba(37, 99, 235, .25);
    }

    /* Cruz médica */

    .logo::before {
      content: "";

      width: 27px;
      height: 8px;

      background: white;

      border-radius: 5px;

      position: absolute;
    }

    .logo::after {
      content: "";

      width: 8px;
      height: 27px;

      background: white;

      border-radius: 5px;

      position: absolute;
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 800;

      letter-spacing: -.6px;
    }

    .brand p {
      color: var(--muted);

      font-size: 11px;

      margin-top: 3px;
    }


    /* =========================================
       HEADER
    ========================================= */

    .badge {
      display: inline-block;

      background: var(--primary-light);

      color: var(--primary);

      padding: 6px 10px;

      border-radius: 7px;

      font-size: 10px;

      font-weight: bold;

      letter-spacing: .7px;

      margin-bottom: 12px;
    }

    .header h2 {
      font-size: 28px;

      letter-spacing: -.8px;

      margin-bottom: 8px;
    }

    .header p {
      color: var(--muted);

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 30px;
    }


    /* =========================================
       FORM
    ========================================= */

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 8px;
    }

    .form-group small {
      color: #94a3b8;

      font-weight: normal;
    }


    /* =========================================
       INPUT
    ========================================= */

    .input-box {
      position: relative;
    }

    .input-icon {
      position: absolute;

      left: 15px;
      top: 50%;

      transform: translateY(-50%);

      color: #94a3b8;

      font-size: 16px;

      z-index: 2;

      pointer-events: none;
    }

    input,
    select {
      width: 100%;

      height: 54px;

      border: 1px solid var(--border);

      border-radius: 12px;

      outline: none;

      background: white;

      padding:
        0
        15px
        0
        44px;

      font-family: inherit;

      font-size: 14px;

      color: var(--text);

      transition: .2s;
    }

    input::placeholder {
      color: #a0aec0;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 4px
        rgba(37, 99, 235, .08);
    }


    /* =========================================
       SELECT
    ========================================= */

    .select-box {
      position: relative;
    }

    .select-box select {
      appearance: none;

      cursor: pointer;
    }

    .select-arrow {
      position: absolute;

      right: 17px;
      top: 50%;

      transform: translateY(-50%);

      color: #64748b;

      pointer-events: none;
    }


    /* =========================================
       UPLOAD
    ========================================= */

    .upload {
      border: 2px dashed #cbd5e1;

      border-radius: 13px;

      min-height: 90px;

      background: #f8fafc;

      display: flex;

      align-items: center;

      gap: 14px;

      padding: 15px;

      cursor: pointer;

      transition: .2s;
    }

    .upload:hover {
      background: var(--primary-light);

      border-color: var(--primary);
    }

    .upload-icon {
      width: 45px;
      height: 45px;

      flex-shrink: 0;

      border-radius: 11px;

      background: #dbeafe;

      color: var(--primary);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 23px;

      font-weight: bold;
    }

    .upload-text {
      display: flex;

      flex-direction: column;

      gap: 5px;
    }

    .upload-text strong {
      font-size: 13px;
    }

    .upload-text span {
      color: var(--muted);

      font-size: 11px;
    }

    #foto {
      display: none;
    }

    .file-name {
      font-size: 11px;

      color: var(--primary);

      margin-top: 7px;
    }


    /* =========================================
       PREVIEW DA FOTO
    ========================================= */

    .preview {
      display: none;

      margin-top: 10px;

      align-items: center;

      gap: 10px;
    }

    .preview img {
      width: 55px;
      height: 55px;

      object-fit: cover;

      border-radius: 10px;

      border: 2px solid #dbeafe;
    }

    .preview span {
      font-size: 12px;

      color: var(--muted);
    }


    /* =========================================
       BOTÃO
    ========================================= */

    button {
      width: 100%;

      height: 55px;

      border: none;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          #3b82f6
        );

      color: white;

      font-family: inherit;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      box-shadow:
        0 10px 25px
        rgba(37, 99, 235, .22);

      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 14px 30px
        rgba(37, 99, 235, .30);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: .65;

      cursor: not-allowed;

      transform: none;
    }

    .button-icon {
      font-size: 17px;
    }


    /* =========================================
       STATUS
    ========================================= */

    .status {
      display: none;

      padding: 13px 15px;

      border-radius: 10px;

      margin-top: 18px;

      font-size: 12px;

      line-height: 1.5;
    }

    .status.success {
      display: block;

      background: var(--success-bg);

      color: var(--success);

      border: 1px solid #bbf7d0;
    }

    .status.error {
      display: block;

      background: var(--error-bg);

      color: var(--error);

      border: 1px solid #fecaca;
    }


    /* =========================================
       FOOTER
    ========================================= */

    .footer {
      text-align: center;

      margin-top: 25px;

      color: #94a3b8;

      font-size: 10px;
    }


    /* =========================================
       LOADING
    ========================================= */

    .loading {
      width: 16px;
      height: 16px;

      border: 2px solid rgba(255,255,255,.4);

      border-top-color: white;

      border-radius: 50%;

      animation: girar .7s linear infinite;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }


    /* =========================================
       RESPONSIVO
    ========================================= */

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .card {
        padding: 28px 21px;

        border-radius: 20px;
      }

      .brand {
        margin-bottom: 28px;
      }

      .header h2 {
        font-size: 24px;
      }

      .header p {
        font-size: 13px;
      }
    }

  </style>
</head>


<body>

  <div class="container">

    <div class="card">


      <!-- ===============================
           LOGO
      ================================ -->

      <div class="brand">

        <div class="logo"></div>

        <div>
          <h1>MedFlow</h1>
          <p>Atendimento & Triagem</p>
        </div>

      </div>


      <!-- ===============================
           CABEÇALHO
      ================================ -->

      <div class="header">

        <span class="badge">
          NOVO ATENDIMENTO
        </span>

        <h2>
          Cadastro do paciente
        </h2>

        <p>
          Preencha os dados abaixo para
          encaminhar o paciente para a triagem.
        </p>

      </div>


      <!-- ===============================
           FORMULÁRIO
      ================================ -->

      <form id="formAtendimento">


        <!-- NOME -->

        <div class="form-group">

          <label for="nome">
            Nome completo
          </label>

          <div class="input-box">

            <span class="input-icon">
              👤
            </span>

            <input
              type="text"
              id="nome"
              placeholder="Digite o nome completo"
              autocomplete="name"
              required
            >

          </div>

        </div>


        <!-- CPF -->

        <div class="form-group">

          <label for="cpf">
            CPF
          </label>

          <div class="input-box">

            <span class="input-icon">
              ▣
            </span>

            <input
              type="text"
              id="cpf"
              placeholder="000.000.000-00"
              maxlength="14"
              inputmode="numeric"
              required
            >

          </div>

        </div>


        <!-- TIPO -->

        <div class="form-group">

          <label for="tipo">
            Tipo de atendimento
          </label>

          <div class="input-box select-box">

            <span class="input-icon">
              ▤
            </span>

            <select
              id="tipo"
              required
            >

              <option
                value=""
                disabled
                selected
              >
                Selecione o tipo de atendimento
              </option>

              <option value="Convenio">
                Convênio
              </option>

              <option value="Particular">
                Particular
              </option>

            </select>

            <span class="select-arrow">
              ▼
            </span>

          </div>

        </div>


        <!-- FOTO -->

        <div class="form-group">

          <label>
            Foto do paciente
            <small>
              (opcional)
            </small>
          </label>

          <label
            class="upload"
            for="foto"
          >

            <div class="upload-icon">
              ↑
            </div>

            <div class="upload-text">

              <strong>
                Adicionar foto
              </strong>

              <span>
                Clique para selecionar uma imagem
              </span>

            </div>

            <input
              type="file"
              id="foto"
              accept="image/*"
            >

          </label>


          <div
            id="fileName"
            class="file-name"
          ></div>


          <div
            id="preview"
            class="preview"
          >

            <img
              id="previewImage"
              alt="Pré-visualização"
            >

            <span>
              Pré-visualização da foto
            </span>

          </div>

        </div>


        <!-- BOTÃO -->

        <button
          type="submit"
          id="btnCadastrar"
        >

          <span
            id="buttonIcon"
            class="button-icon"
          >
            ✓
          </span>

          <span id="buttonText">
            Cadastrar paciente
          </span>

        </button>


      </form>


      <!-- STATUS -->

      <div
        id="status"
        class="status"
      ></div>


      <!-- RODAPÉ -->

      <div class="footer">
        🔒 Seus dados são tratados com segurança
      </div>


    </div>

  </div>


  <script>

    /* =========================================
       ELEMENTOS
    ========================================= */

    const form =
      document.getElementById("formAtendimento");

    const nome =
      document.getElementById("nome");

    const cpf =
      document.getElementById("cpf");

    const tipo =
      document.getElementById("tipo");

    const foto =
      document.getElementById("foto");

    const fileName =
      document.getElementById("fileName");

    const preview =
      document.getElementById("preview");

    const previewImage =
      document.getElementById("previewImage");

    const btnCadastrar =
      document.getElementById("btnCadastrar");

    const buttonText =
      document.getElementById("buttonText");

    const buttonIcon =
      document.getElementById("buttonIcon");

    const status =
      document.getElementById("status");


    /* =========================================
       MÁSCARA CPF
    ========================================= */

    cpf.addEventListener("input", function () {

      let valor =
        this.value.replace(/\D/g, "");

      valor =
        valor.substring(0, 11);

      if (valor.length > 9) {

        valor =
          valor.replace(
            /(\d{3})(\d{3})(\d{3})(\d{1,2})/,
            "$1.$2.$3-$4"
          );

      } else if (valor.length > 6) {

        valor =
          valor.replace(
            /(\d{3})(\d{3})(\d{1,3})/,
            "$1.$2.$3"
          );

      } else if (valor.length > 3) {

        valor =
          valor.replace(
            /(\d{3})(\d{1,3})/,
            "$1.$2"
          );

      }

      this.value = valor;

    });


    /* =========================================
       FOTO
    ========================================= */

    foto.addEventListener("change", function () {

      if (!this.files.length) {

        fileName.textContent = "";

        preview.style.display = "none";

        return;
      }


      const arquivo = this.files[0];


      fileName.textContent =
        "Arquivo: " + arquivo.name;


      /* Pré-visualização */

      const leitor =
        new FileReader();

      leitor.onload = function (event) {

        previewImage.src =
          event.target.result;

        preview.style.display =
          "flex";

      };

      leitor.readAsDataURL(arquivo);

    });


    /* =========================================
       MENSAGEM
    ========================================= */

    function mostrarStatus(
      mensagem,
      tipoMensagem
    ) {

      status.className =
        "status " + tipoMensagem;

      status.textContent =
        mensagem;

    }


    /* =========================================
       CADASTRO
    ========================================= */

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        /* Limpa mensagem */

        status.className = "status";
        status.textContent = "";


        /* Validação */

        if (!nome.value.trim()) {

          mostrarStatus(
            "⚠ Informe o nome do paciente.",
            "error"
          );

          nome.focus();

          return;
        }


        const cpfNumeros =
          cpf.value.replace(/\D/g, "");


        if (cpfNumeros.length !== 11) {

          mostrarStatus(
            "⚠ Informe um CPF válido.",
            "error"
          );

          cpf.focus();

          return;
        }


        if (!tipo.value) {

          mostrarStatus(
            "⚠ Selecione o tipo de atendimento.",
            "error"
          );

          tipo.focus();

          return;
        }


        /* Loading */

        btnCadastrar.disabled = true;

        buttonIcon.innerHTML =
          '<span class="loading"></span>';

        buttonText.textContent =
          "Enviando...";


        try {

          const resposta =
            await fetch(
              "http://localhost:3000/atendimento",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  nome:
                    nome.value.trim(),

                  cpf:
                    cpf.value,

                  tipo:
                    tipo.value

                })
              }
            );


          if (!resposta.ok) {
            throw new Error(
              "Erro no servidor"
            );
          }


          /* Sucesso */

          mostrarStatus(
            "✓ Paciente cadastrado com sucesso e enviado para a triagem.",
            "success"
          );


          /* Limpa formulário */

          form.reset();

          fileName.textContent = "";

          preview.style.display =
            "none";


        } catch (erro) {

          console.error(erro);


          mostrarStatus(
            "⚠ Não foi possível conectar ao servidor. Verifique se o backend está funcionando.",
            "error"
          );


        } finally {

          btnCadastrar.disabled =
            false;

          buttonIcon.textContent =
            "✓";

          buttonText.textContent =
            "Cadastrar paciente";

        }

      }
    );

  </script>

</body>
</html>
