<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MedFlow | Medicações Prescritas</title>


<style>

/* =====================================================
   CONFIGURAÇÕES
===================================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}


:root {

  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-light: #eff6ff;

  --green: #16a34a;
  --green-light: #f0fdf4;

  --background: #f1f5f9;

  --white: #ffffff;

  --text: #172033;
  --muted: #64748b;

  --border: #e2e8f0;

  --shadow:
    0 10px 30px
    rgba(15, 23, 42, .07);
}


/* =====================================================
   BODY
===================================================== */

body {

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: var(--text);

  background:

    radial-gradient(
      circle at 0% 0%,
      #dbeafe,
      transparent 30%
    ),

    var(--background);
}


/* =====================================================
   CONTAINER
===================================================== */

.container {

  max-width: 1400px;

  width: 100%;

  margin: auto;

  padding: 25px;
}


/* =====================================================
   HEADER
===================================================== */

.header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 25px;
}


.brand {

  display: flex;

  align-items: center;

  gap: 13px;
}


.logo {

  width: 52px;
  height: 52px;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #3b82f6
    );

  position: relative;

  box-shadow:
    0 8px 20px
    rgba(37,99,235,.22);
}


/* Cruz */

.logo::before {

  content: "";

  position: absolute;

  width: 27px;
  height: 8px;

  background: white;

  border-radius: 5px;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);
}


.logo::after {

  content: "";

  position: absolute;

  width: 8px;
  height: 27px;

  background: white;

  border-radius: 5px;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);
}


.brand h1 {

  font-size: 21px;

  font-weight: 800;
}


.brand p {

  color: var(--muted);

  font-size: 11px;

  margin-top: 4px;
}


/* =====================================================
   AÇÕES
===================================================== */

.header-actions {

  display: flex;

  gap: 9px;
}


.btn {

  border: none;

  border-radius: 10px;

  padding: 11px 15px;

  font-size: 12px;

  font-weight: 800;

  cursor: pointer;

  transition: .2s;
}


.btn:hover {

  transform:
    translateY(-1px);
}


.btn-primary {

  background:
    var(--primary);

  color: white;
}


.btn-primary:hover {

  background:
    var(--primary-dark);
}


.btn-secondary {

  background:
    white;

  color:
    var(--text);

  border:
    1px solid var(--border);
}


/* =====================================================
   TOPO DA PÁGINA
===================================================== */

.page-card {

  background:
    rgba(255,255,255,.97);

  border:
    1px solid var(--border);

  border-radius: 18px;

  box-shadow:
    var(--shadow);

  overflow: hidden;
}


.page-header {

  padding: 22px;

  border-bottom:
    1px solid var(--border);

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 20px;
}


.page-title {

  display: flex;

  align-items: center;

  gap: 12px;
}


.title-icon {

  width: 46px;
  height: 46px;

  border-radius: 12px;

  background:
    var(--green-light);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 22px;
}


.page-title h2 {

  font-size: 18px;

  margin-bottom: 4px;
}


.page-title p {

  color: var(--muted);

  font-size: 11px;
}


/* =====================================================
   CONTADOR
===================================================== */

.counter {

  min-width: 115px;

  padding: 10px 14px;

  background:
    var(--primary-light);

  border:
    1px solid #bfdbfe;

  border-radius: 11px;

  text-align: center;
}


.counter-number {

  display: block;

  font-size: 21px;

  font-weight: 800;

  color:
    var(--primary);
}


.counter-label {

  display: block;

  font-size: 9px;

  color:
    var(--muted);

  margin-top: 2px;
}


/* =====================================================
   BARRA DE BUSCA
===================================================== */

.toolbar {

  padding: 15px 22px;

  background:
    #f8fafc;

  border-bottom:
    1px solid var(--border);

  display: flex;

  gap: 10px;
}


.search {

  flex: 1;

  position: relative;
}


.search-icon {

  position: absolute;

  left: 13px;

  top: 50%;

  transform:
    translateY(-50%);

  color:
    var(--muted);

  font-size: 15px;
}


#busca {

  width: 100%;

  height: 43px;

  padding:
    0 14px 0 38px;

  border:
    1px solid var(--border);

  border-radius: 9px;

  outline: none;

  background:
    white;

  color:
    var(--text);

  font-size: 12px;
}


#busca:focus {

  border-color:
    var(--primary);

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.08);
}


/* =====================================================
   LISTA
===================================================== */

#listaMedicacoes {

  padding: 22px;

  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 15px;
}


/* =====================================================
   CARD DA PRESCRIÇÃO
===================================================== */

.med-card {

  background:
    white;

  border:
    1px solid var(--border);

  border-radius: 14px;

  padding: 17px;

  transition: .2s;

  position: relative;

  overflow: hidden;
}


.med-card::before {

  content: "";

  position: absolute;

  left: 0;

  top: 0;

  bottom: 0;

  width: 4px;

  background:
    linear-gradient(
      #16a34a,
      #22c55e
    );
}


.med-card:hover {

  border-color:
    #bfdbfe;

  box-shadow:
    0 8px 20px
    rgba(15,23,42,.06);

  transform:
    translateY(-2px);
}


/* =====================================================
   CABEÇALHO DO CARD
===================================================== */

.med-card-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  margin-bottom: 15px;
}


.patient {

  display: flex;

  align-items: center;

  gap: 10px;
}


.avatar {

  width: 40px;
  height: 40px;

  border-radius: 10px;

  background:
    var(--primary-light);

  color:
    var(--primary);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 13px;

  font-weight: 800;
}


.patient-name {

  font-size: 14px;

  font-weight: 800;
}


.patient-label {

  display: block;

  color:
    var(--muted);

  font-size: 9px;

  margin-top: 3px;
}


/* =====================================================
   STATUS
===================================================== */

.status {

  padding: 5px 9px;

  border-radius: 20px;

  background:
    #dcfce7;

  color:
    #15803d;

  font-size: 9px;

  font-weight: 800;

  white-space: nowrap;
}


/* =====================================================
   MEDICAÇÃO
===================================================== */

.medication {

  background:
    var(--green-light);

  border:
    1px solid #bbf7d0;

  border-radius: 10px;

  padding: 12px;

  margin-bottom: 10px;
}


.medication-label {

  color:
    #15803d;

  font-size: 9px;

  font-weight: 800;

  text-transform: uppercase;

  margin-bottom: 5px;
}


.medication-name {

  color:
    #166534;

  font-size: 14px;

  font-weight: 800;

  line-height: 1.35;
}


/* =====================================================
   INFORMAÇÕES
===================================================== */

.details {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 9px;

  margin-top: 10px;
}


.detail {

  padding: 10px;

  background:
    #f8fafc;

  border:
    1px solid #e5e7eb;

  border-radius: 9px;
}


.detail-label {

  display: block;

  color:
    var(--muted);

  font-size: 9px;

  margin-bottom: 4px;
}


.detail-value {

  display: block;

  color:
    var(--text);

  font-size: 11px;

  font-weight: 700;

  line-height: 1.35;
}


/* =====================================================
   OBSERVAÇÃO
===================================================== */

.observacao {

  margin-top: 10px;

  padding: 10px;

  background:
    #f8fafc;

  border:
    1px solid #e5e7eb;

  border-radius: 9px;

  color:
    var(--muted);

  font-size: 10px;

  line-height: 1.45;
}


.observacao strong {

  color:
    var(--text);
}


/* =====================================================
   ESTADO VAZIO
===================================================== */

.empty {

  grid-column:
    1 / -1;

  text-align: center;

  padding: 70px 20px;

  color:
    var(--muted);
}


.empty-icon {

  width: 65px;
  height: 65px;

  margin:
    0 auto 15px;

  border-radius: 18px;

  background:
    var(--green-light);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 30px;
}


.empty strong {

  display: block;

  color:
    var(--text);

  font-size: 14px;

  margin-bottom: 5px;
}


.empty span {

  font-size: 11px;
}


/* =====================================================
   LOADING
===================================================== */

.loading {

  grid-column:
    1 / -1;

  text-align: center;

  padding: 60px;

  color:
    var(--muted);
}


.spinner {

  width: 35px;
  height: 35px;

  border:
    3px solid #dbeafe;

  border-top-color:
    var(--primary);

  border-radius: 50%;

  margin:
    0 auto 12px;

  animation:
    spin .8s linear infinite;
}


@keyframes spin {

  to {

    transform:
      rotate(360deg);

  }

}


/* =====================================================
   TOAST
===================================================== */

#toast {

  position: fixed;

  right: 25px;

  bottom: 25px;

  background:
    #172033;

  color:
    white;

  padding: 13px 17px;

  border-radius: 10px;

  font-size: 12px;

  font-weight: 700;

  opacity: 0;

  transform:
    translateY(20px);

  pointer-events: none;

  transition: .3s;

  z-index: 9999;
}


#toast.show {

  opacity: 1;

  transform:
    translateY(0);
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media (max-width: 850px) {

  #listaMedicacoes {

    grid-template-columns:
      1fr;
  }

}


@media (max-width: 600px) {

  .container {

    padding: 15px;
  }


  .header {

    align-items: flex-start;

    flex-direction: column;

    gap: 15px;
  }


  .header-actions {

    width: 100%;
  }


  .header-actions button {

    flex: 1;
  }


  .page-header {

    align-items: flex-start;

    flex-direction: column;
  }


  .counter {

    width: 100%;
  }


  .toolbar {

    flex-direction: column;
  }


  #listaMedicacoes {

    padding: 15px;
  }


  .details {

    grid-template-columns:
      1fr;
  }

}

</style>

</head>


<body>


<div class="container">


  <!-- =================================================
       CABEÇALHO PRINCIPAL
  ================================================== -->

  <header class="header">


    <div class="brand">

      <div class="logo"></div>

      <div>

        <h1>
          MedFlow
        </h1>

        <p>
          Sistema de Gestão Hospitalar
        </p>

      </div>

    </div>


    <div class="header-actions">

      <button
        class="btn btn-secondary"
        onclick="carregarMedicacoesPrescritas()"
      >
        🔄 Atualizar
      </button>


      <button
        class="btn btn-primary"
        onclick="window.location.href='medico.html'"
      >
        🩺 Painel Médico
      </button>

    </div>


  </header>



  <!-- =================================================
       CONTEÚDO
  ================================================== -->

  <section class="page-card">


    <!-- TÍTULO -->

    <div class="page-header">


      <div class="page-title">

        <div class="title-icon">
          💊
        </div>


        <div>

          <h2>
            Medicações Prescritas
          </h2>

          <p>
            Acompanhe as prescrições realizadas durante as consultas
          </p>

        </div>

      </div>


      <div class="counter">

        <span
          id="contador"
          class="counter-number"
        >
          0
        </span>

        <span class="counter-label">
          prescrições
        </span>

      </div>


    </div>



    <!-- BUSCA -->

    <div class="toolbar">


      <div class="search">

        <span class="search-icon">
          🔎
        </span>

        <input
          id="busca"
          type="search"
          placeholder="Buscar por paciente, medicação ou diagnóstico..."
          oninput="filtrarMedicacoes()"
        >

      </div>


      <button
        class="btn btn-secondary"
        onclick="limparBusca()"
      >
        Limpar
      </button>


    </div>



    <!-- LISTA -->

    <div id="listaMedicacoes">

      <div class="loading">

        <div class="spinner"></div>

        Carregando prescrições...

      </div>

    </div>


  </section>


</div>



<div id="toast"></div>



<script>


/* =====================================================
   VARIÁVEIS
===================================================== */

let medicacoes = [];

let toastTimer;


/* =====================================================
   ELEMENTOS
===================================================== */

const lista =
  document.getElementById(
    "listaMedicacoes"
  );


const contador =
  document.getElementById(
    "contador"
  );


/* =====================================================
   INICIAL DO PACIENTE
===================================================== */

function inicial(
  nome
) {

  if (!nome) {

    return "?";

  }


  const partes =
    nome
      .trim()
      .split(/\s+/);


  if (
    partes.length >= 2
  ) {

    return (
      partes[0][0] +
      partes[partes.length - 1][0]
    ).toUpperCase();

  }


  return partes[0][0]
    .toUpperCase();

}


/* =====================================================
   TOAST
===================================================== */

function mostrarToast(
  mensagem
) {

  const toast =
    document.getElementById(
      "toast"
    );


  clearTimeout(
    toastTimer
  );


  toast.textContent =
    mensagem;


  toast.className =
    "show";


  toastTimer =
    setTimeout(
      () => {

        toast.className =
          "";

      },
      3000
    );

}


/* =====================================================
   CARREGAR MEDICAÇÕES
===================================================== */

async function carregarMedicacoesPrescritas() {

  lista.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Carregando prescrições...

    </div>

  `;


  try {

    const resposta =
      await fetch(
        "/medicacoes",
        {
          cache: "no-store"
        }
      );


    if (!resposta.ok) {

      throw new Error(
        "Erro HTTP " +
        resposta.status
      );

    }


    const data =
      await resposta.json();


    medicacoes =
      Array.isArray(data)
        ? data
        : [];


    renderizarMedicacoes(
      medicacoes
    );


  } catch (erro) {

    console.error(
      "Erro:",
      erro
    );


    contador.textContent =
      "0";


    lista.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <strong>
          Não foi possível carregar as prescrições
        </strong>

        <span>
          Verifique se o servidor está funcionando e tente novamente.
        </span>

      </div>

    `;

  }

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizarMedicacoes(
  dados
) {

  lista.innerHTML = "";


  contador.textContent =
    dados.length;


  /* ===============================================
     VAZIO
  =============================================== */

  if (
    dados.length === 0
  ) {

    lista.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          💊
        </div>

        <strong>
          Nenhuma medicação prescrita
        </strong>

        <span>
          As prescrições realizadas pelos médicos aparecerão aqui.
        </span>

      </div>

    `;

    return;

  }


  /* ===============================================
     CARDS
  =============================================== */

  dados.forEach(
    consulta => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "med-card";


      /* =========================================
         HEADER
      ========================================== */

      const header =
        document.createElement(
          "div"
        );


      header.className =
        "med-card-header";


      const patient =
        document.createElement(
          "div"
        );


      patient.className =
        "patient";


      const avatar =
        document.createElement(
          "div"
        );


      avatar.className =
        "avatar";


      avatar.textContent =
        inicial(
          consulta.paciente
        );


      const patientInfo =
        document.createElement(
          "div"
        );


      const patientName =
        document.createElement(
          "div"
        );


      patientName.className =
        "patient-name";


      patientName.textContent =
        consulta.paciente ||
        "Paciente";


      const label =
        document.createElement(
          "span"
        );


      label.className =
        "patient-label";


      label.textContent =
        "Paciente";


      patientInfo.appendChild(
        patientName
      );


      patientInfo.appendChild(
        label
      );


      patient.appendChild(
        avatar
      );


      patient.appendChild(
        patientInfo
      );


      /* STATUS */

      const status =
        document.createElement(
          "span"
        );


      status.className =
        "status";


      status.textContent =
        "Prescrito";


      header.appendChild(
        patient
      );


      header.appendChild(
        status
      );


      /* =========================================
         MEDICAÇÃO
      ========================================== */

      const medication =
        document.createElement(
          "div"
        );


      medication.className =
        "medication";


      const medicationLabel =
        document.createElement(
          "div"
        );


      medicationLabel.className =
        "medication-label";


      medicationLabel.textContent =
        "💊 Medicação / Conduta";


      const medicationName =
        document.createElement(
          "div"
        );


      medicationName.className =
        "medication-name";


      medicationName.textContent =
        consulta.medicacao ||
        "Não informada";


      medication.appendChild(
        medicationLabel
      );


      medication.appendChild(
        medicationName
      );


      /* =========================================
         DETALHES
      ========================================== */

      const details =
        document.createElement(
          "div"
        );


      details.className =
        "details";


      criarDetalhe(
        details,
        "Diagnóstico",
        consulta.diagnostico ||
        "Não informado"
      );


      criarDetalhe(
        details,
        "Atendimento",
        consulta.data ||
        consulta.createdAt ||
        "Registrado"
      );


      /* =========================================
         OBSERVAÇÃO
      ========================================== */

      const observacao =
        document.createElement(
          "div"
        );


      observacao.className =
        "observacao";


      const obsStrong =
        document.createElement(
          "strong"
        );


      obsStrong.textContent =
        "Observações: ";


      const obsText =
        document.createElement(
          "span"
        );


      obsText.textContent =
        consulta.obs ||
        "Nenhuma observação registrada.";


      observacao.appendChild(
        obsStrong
      );


      observacao.appendChild(
        obsText
      );


      /* =========================================
         MONTAR CARD
      ========================================== */

      card.appendChild(
        header
      );


      card.appendChild(
        medication
      );


      card.appendChild(
        details
      );


      card.appendChild(
        observacao
      );


      lista.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   CRIAR DETALHE
===================================================== */

function criarDetalhe(
  container,
  titulo,
  valor
) {

  const detail =
    document.createElement(
      "div"
    );


  detail.className =
    "detail";


  const label =
    document.createElement(
      "span"
    );


  label.className =
    "detail-label";


  label.textContent =
    titulo;


  const value =
    document.createElement(
      "span"
    );


  value.className =
    "detail-value";


  value.textContent =
    valor;


  detail.appendChild(
    label
  );


  detail.appendChild(
    value
  );


  container.appendChild(
    detail
  );

}


/* =====================================================
   FILTRO
===================================================== */

function filtrarMedicacoes() {

  const termo =
    document
      .getElementById(
        "busca"
      )
      .value
      .trim()
      .toLowerCase();


  if (!termo) {

    renderizarMedicacoes(
      medicacoes
    );

    return;

  }


  const filtradas =
    medicacoes.filter(
      item => {

        const paciente =
          String(
            item.paciente || ""
          ).toLowerCase();


        const medicacao =
          String(
            item.medicacao || ""
          ).toLowerCase();


        const diagnostico =
          String(
            item.diagnostico || ""
          ).toLowerCase();


        const obs =
          String(
            item.obs || ""
          ).toLowerCase();


        return (

          paciente.includes(
            termo
          ) ||

          medicacao.includes(
            termo
          ) ||

          diagnostico.includes(
            termo
          ) ||

          obs.includes(
            termo
          )

        );

      }
    );


  renderizarMedicacoes(
    filtradas
  );

}


/* =====================================================
   LIMPAR BUSCA
===================================================== */

function limparBusca() {
