<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MedFlow | Login</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}


/* =====================================================
   CORES
===================================================== */

:root {

  --primary: #2563eb;
  --primary-dark: #1d4ed8;

  --background: #f1f5f9;

  --white: #ffffff;

  --text: #172033;

  --muted: #64748b;

  --border: #dbe2ea;

  --danger: #dc2626;

}


/* =====================================================
   BODY
===================================================== */

body {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:

    radial-gradient(
      circle at 10% 10%,
      #dbeafe,
      transparent 30%
    ),

    radial-gradient(
      circle at 90% 90%,
      #e0f2fe,
      transparent 30%
    ),

    var(--background);
}


/* =====================================================
   CONTAINER
===================================================== */

.login-container {

  width: 100%;

  max-width: 430px;

  background: var(--white);

  border: 1px solid #e2e8f0;

  border-radius: 22px;

  padding: 38px;

  box-shadow:
    0 25px 60px
    rgba(15, 23, 42, .12);

  animation:
    aparecer .5s ease;
}


@keyframes aparecer {

  from {

    opacity: 0;

    transform:
      translateY(15px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


/* =====================================================
   LOGO
===================================================== */

.logo-area {

  text-align: center;

  margin-bottom: 30px;
}


.logo {

  width: 76px;

  height: 76px;

  margin: 0 auto 15px;

  border-radius: 22px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #3b82f6
    );

  position: relative;

  box-shadow:
    0 12px 25px
    rgba(37, 99, 235, .25);
}


/* Cruz horizontal */

.logo::before {

  content: "";

  position: absolute;

  width: 40px;

  height: 11px;

  background: white;

  border-radius: 7px;

  top: 50%;

  left: 50%;

  transform:
    translate(-50%, -50%);
}


/* Cruz vertical */

.logo::after {

  content: "";

  position: absolute;

  width: 11px;

  height: 40px;

  background: white;

  border-radius: 7px;

  top: 50%;

  left: 50%;

  transform:
    translate(-50%, -50%);
}


.logo-area h1 {

  font-size: 27px;

  color:
    var(--text);

  font-weight: 800;

  letter-spacing: -.5px;
}


.logo-area h1 span {

  color:
    var(--primary);
}


.logo-area p {

  color:
    var(--muted);

  font-size: 12px;

  margin-top: 7px;
}


/* =====================================================
   TÍTULO
===================================================== */

.login-title {

  margin-bottom: 20px;
}


.login-title h2 {

  font-size: 19px;

  color:
    var(--text);

  margin-bottom: 5px;
}


.login-title p {

  color:
    var(--muted);

  font-size: 11px;
}


/* =====================================================
   CAMPOS
===================================================== */

.form-group {

  margin-bottom: 16px;
}


.form-group label {

  display: block;

  font-size: 11px;

  font-weight: 800;

  color:
    #334155;

  margin-bottom: 7px;
}


.input-wrapper {

  position: relative;
}


.input-icon {

  position: absolute;

  left: 14px;

  top: 50%;

  transform:
    translateY(-50%);

  color:
    var(--muted);

  font-size: 15px;

  pointer-events: none;
}


input {

  width: 100%;

  height: 48px;

  padding:
    0 44px;

  border:
    1px solid var(--border);

  border-radius: 11px;

  outline: none;

  background:
    #f8fafc;

  color:
    var(--text);

  font-size: 13px;

  transition: .2s;
}


input::placeholder {

  color:
    #94a3b8;
}


input:focus {

  background:
    white;

  border-color:
    var(--primary);

  box-shadow:
    0 0 0 4px
    rgba(37,99,235,.09);
}


/* =====================================================
   BOTÃO MOSTRAR SENHA
===================================================== */

.toggle-password {

  position: absolute;

  right: 12px;

  top: 50%;

  transform:
    translateY(-50%);

  border: none;

  background: transparent;

  cursor: pointer;

  color:
    var(--muted);

  font-size: 15px;

  padding: 5px;
}


.toggle-password:hover {

  color:
    var(--primary);
}


/* =====================================================
   BOTÃO LOGIN
===================================================== */

.btn-login {

  width: 100%;

  height: 49px;

  border: none;

  border-radius: 11px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      #3b82f6
    );

  color: white;

  font-size: 13px;

  font-weight: 800;

  cursor: pointer;

  margin-top: 7px;

  box-shadow:
    0 8px 20px
    rgba(37,99,235,.22);

  transition: .2s;
}


.btn-login:hover {

  transform:
    translateY(-1px);

  box-shadow:
    0 12px 25px
    rgba(37,99,235,.28);
}


.btn-login:active {

  transform:
    translateY(0);
}


.btn-login:disabled {

  opacity: .7;

  cursor:
    not-allowed;

  transform:
    none;
}


/* =====================================================
   MENSAGEM
===================================================== */

#mensagem {

  min-height: 18px;

  text-align: center;

  font-size: 11px;

  font-weight: 700;

  margin-top: 14px;
}


.erro {

  color:
    var(--danger);
}


.sucesso {

  color:
    #16a34a;
}


/* =====================================================
   RODAPÉ
===================================================== */

.footer {

  text-align: center;

  margin-top: 28px;

  padding-top: 20px;

  border-top:
    1px solid #eef2f7;

  color:
    #94a3b8;

  font-size: 10px;
}


.footer strong {

  color:
    #64748b;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media (max-width: 480px) {

  body {

    padding: 15px;
  }


  .login-container {

    padding: 28px 22px;

    border-radius: 18px;
  }


  .logo {

    width: 68px;

    height: 68px;
  }


  .logo::before {

    width: 36px;

    height: 10px;
  }


  .logo::after {

    width: 10px;

    height: 36px;
  }

}

</style>

</head>


<body>


<div class="login-container">


  <!-- =================================================
       LOGO
  ================================================== -->

  <div class="logo-area">

    <div class="logo"></div>

    <h1>
      Med<span>Flow</span>
    </h1>

    <p>
      Sistema de Gestão Hospitalar
    </p>

  </div>



  <!-- =================================================
       TÍTULO
  ================================================== -->

  <div class="login-title">

    <h2>
      Acesso ao sistema
    </h2>

    <p>
      Entre com suas credenciais para continuar.
    </p>

  </div>



  <!-- =================================================
       USUÁRIO
  ================================================== -->

  <div class="form-group">

    <label for="usuario">
      Usuário
    </label>

    <div class="input-wrapper">

      <span class="input-icon">
        👤
      </span>

      <input
        id="usuario"
        type="text"
        placeholder="Digite seu usuário"
        autocomplete="username"
      >

    </div>

  </div>



  <!-- =================================================
       SENHA
  ================================================== -->

  <div class="form-group">

    <label for="senha">
      Senha
    </label>

    <div class="input-wrapper">

      <span class="input-icon">
        🔒
      </span>

      <input
        id="senha"
        type="password"
        placeholder="Digite sua senha"
        autocomplete="current-password"
        onkeydown="if(event.key === 'Enter') login()"
      >

      <button
        type="button"
        class="toggle-password"
        onclick="mostrarSenha()"
        aria-label="Mostrar senha"
      >
        👁️
      </button>

    </div>

  </div>



  <!-- =================================================
       BOTÃO
  ================================================== -->

  <button
    id="btnLogin"
    class="btn-login"
    onclick="login()"
  >

    Entrar no sistema

  </button>



  <!-- =================================================
       MENSAGEM
  ================================================== -->

  <div id="mensagem"></div>



  <!-- =================================================
       RODAPÉ
  ================================================== -->

  <div class="footer">

    <strong>MedFlow</strong>
    · Sistema Hospitalar

    <br>

    Acesso restrito a usuários autorizados.

  </div>


</div>



<script>


/* =====================================================
   ELEMENTOS
===================================================== */

const usuarioInput =
  document.getElementById(
    "usuario"
  );


const senhaInput =
  document.getElementById(
    "senha"
  );


const mensagem =
  document.getElementById(
    "mensagem"
  );


const btnLogin =
  document.getElementById(
    "btnLogin"
  );


/* =====================================================
   MOSTRAR / OCULTAR SENHA
===================================================== */

function mostrarSenha() {

  if (
    senhaInput.type ===
    "password"
  ) {

    senhaInput.type =
      "text";

  } else {

    senhaInput.type =
      "password";

  }

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo
) {

  mensagem.textContent =
    texto;

  mensagem.className =
    tipo;

}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

  const usuario =
    usuarioInput.value.trim();


  const senha =
    senhaInput.value;


  /* ===============================================
     VALIDAÇÃO
  =============================================== */

  if (!usuario) {

    mostrarMensagem(
      "Digite seu usuário.",
      "erro"
    );

    usuarioInput.focus();

    return;

  }


  if (!senha) {

    mostrarMensagem(
      "Digite sua senha.",
      "erro"
    );

    senhaInput.focus();

    return;

  }


  /* ===============================================
     LOADING
  =============================================== */

  btnLogin.disabled =
    true;

  btnLogin.textContent =
    "Entrando...";


  mostrarMensagem(
    "",
    ""
  );


  try {

    const resposta =
      await fetch(
        "http://localhost:3000/login",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              usuario:
                usuario,

              senha:
                senha

            })

        }
      );


    const data =
      await resposta.json();


    /* =============================================
       LOGIN NEGADO
    ============================================== */

    if (
      !resposta.ok ||
      data.erro ||
      data.error
    ) {

      mostrarMensagem(
        data.erro ||
        data.error ||
        "Usuário ou senha inválidos.",
        "erro"
      );

      senhaInput.value =
        "";

      senhaInput.focus();

      return;

    }


    /* =============================================
       LOGIN APROVADO
    ============================================== */

    mostrarMensagem(
      "Login realizado com sucesso!",
      "sucesso"
    );


    /*
      Redirecionamento baseado
      no tipo retornado pelo backend.
    */

    if (
      data.tipo ===
      "triagem"
    ) {

      window.location.href =
        "triagem.html";

      return;

    }


    if (
      data.tipo ===
      "medico"
    ) {

      window.location.href =
        "medico.html";

      return;

    }


    if (
      data.tipo ===
      "atendimento"
    ) {

      window.location.href =
        "atendimento.html";

      return;

    }


    /* =============================================
       TIPO DESCONHECIDO
    ============================================== */

    mostrarMensagem(
      "Usuário autenticado, mas o perfil não foi reconhecido.",
      "erro"
    );


  } catch (erro) {

    console.error(
      "Erro no login:",
      erro
    );


    mostrarMensagem(
      "Não foi possível conectar ao servidor.",
      "erro"
    );

  } finally {

    btnLogin.disabled =
      false;

    btnLogin.textContent =
      "Entrar no sistema";

  }

}


/* =====================================================
   FOCO AUTOMÁTICO
===================================================== */

usuarioInput.focus();

</script>


</body>

</html>
